name: CI HabitaGDL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_s0.py
      - run: python tests/test_s1.py
      - run: python tests/test_geo.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: habita-web/package-lock.json
      - run: npm ci
        working-directory: habita-web
      - run: npm run build
        working-directory: habita-web
